[package]
name = "zero2prod"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "zero2prod"

[dependencies]
actix-web = "4.14.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
config = "0.15.25"
env_logger = "0.11.11"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "macros", "postgres", "uuid", "chrono", "migrate", "tls-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.25.0", features = ["v4"] }

[dev-dependencies]
reqwest = "0.13.4"

